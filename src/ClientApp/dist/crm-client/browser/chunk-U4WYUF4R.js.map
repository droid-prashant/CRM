<p-toast position="bottom-right"></p-toast>

@if (!isLoading) {
    <app-crud
        [columns]="columns"
        [data]="data"
        [fields]="fields"
        [title]="title"
        [dataNotFound]="dataNotFound"
        [errorMessage]="errorMessage"
        [bulkActionLabel]="'Deactivate'"
        [rowActionLabel]="rowActionLabel"
        [rowActionIcon]="rowActionIcon"
        [rowActionLabelResolver]="rowActionLabelResolver"
        [rowActionIconResolver]="rowActionIconResolver"
        [canCreate]="canCreate"
        [canEdit]="canEdit"
        [canRowAction]="canDelete"
        [canBulkAction]="canDelete"
        [canExport]="canExport"
        (save)="saveUser($event)"
        (delete)="toggleUserStatus($event)"
        (bulkDelete)="deactivateUsers($event)"
    />
}
