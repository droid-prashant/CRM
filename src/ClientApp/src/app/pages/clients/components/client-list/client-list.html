<p-toast position="bottom-right"></p-toast>

<section class="mb-4 rounded-md border border-surface-200 bg-surface-0 px-5 py-4 shadow-sm dark:border-surface-700 dark:bg-surface-900">
    <form [formGroup]="filterForm" class="grid grid-cols-12 items-end gap-3">
        <div class="col-span-12 lg:col-span-3">
            <label class="mb-2 block text-xs font-semibold uppercase text-surface-500">Search</label>
            <input pInputText formControlName="searchTerm" class="h-10 w-full text-sm" placeholder="Code, name, website, tax" (keyup.enter)="applyFilters()" />
        </div>

        <div class="col-span-12 sm:col-span-6 lg:col-span-2">
            <label class="mb-2 block text-xs font-semibold uppercase text-surface-500">Country</label>
            <p-select [options]="filterCountries" optionLabel="label" optionValue="value" appendTo="body" formControlName="countryId" placeholder="All countries" [showClear]="!!filterForm.get('countryId')?.value" class="w-full text-sm"/>
             </div>

        <div class="col-span-12 sm:col-span-6 lg:col-span-2">
            <label class="mb-2 block text-xs font-semibold uppercase text-surface-500">Industry</label>
            <p-select [options]="filterIndustries" optionLabel="label" optionValue="value" appendTo="body" formControlName="industryId" placeholder="All industries" [showClear]="!!filterForm.get('industryId')?.value" class="w-full text-sm"/>
            </div>

        <div class="col-span-12 sm:col-span-6 lg:col-span-2">
            <label class="mb-2 block text-xs font-semibold uppercase text-surface-500">Owner</label>
            <p-select [options]="filterOwners" optionLabel="label" optionValue="value" appendTo="body" formControlName="accountOwnerUserId" placeholder="All owners" [showClear]="!!filterForm.get('accountOwnerUserId')?.value" class="w-full text-sm"/>
            </div>

        <div class="col-span-12 sm:col-span-6 lg:col-span-1">
            <label class="mb-2 block text-xs font-semibold uppercase text-surface-500">Status</label>
            <p-select [options]="filterStatuses" optionLabel="label" optionValue="value" appendTo="body" formControlName="status" placeholder="All" [showClear]="filterForm.get('status')?.value != null" class="w-full text-sm"/>
            </div>

        <div class="col-span-12 flex justify-end gap-2 lg:col-span-2">
            <p-button label="Clear" icon="pi pi-filter-slash" severity="secondary" size="small" outlined (onClick)="clearFilters()" />
            <p-button label="Apply" icon="pi pi-filter" size="small" (onClick)="applyFilters()" />
        </div>
    </form>
</section>

@if (!isLoading) {
    <app-crud
        [columns]="columns"
        [data]="data"
        [fields]="fields"
        [title]="title"
        [dataNotFound]="dataNotFound"
        [errorMessage]="errorMessage"
        [bulkActionLabel]="bulkActionLabel"
        [rowActionLabel]="rowActionLabel"
        [rowActionIcon]="rowActionIcon"
        [rowActionLabelResolver]="rowActionLabelResolver"
        [rowActionIconResolver]="rowActionIconResolver"
        [canCreate]="canCreate"
        [canEdit]="canEdit"
        [canRowAction]="canDelete || canEdit"
        [canBulkAction]="canDelete"
        [canExport]="canExport"
        [enableViewAction]="true"
        [lazy]="true"
        [lazyLoadOnInit]="false"
        [totalRecords]="totalRecords"
        [first]="first"
        [rows]="pageSize"
        [rowsPerPageOptions]="[10, 25, 50, 100]"
        [showGlobalSearch]="false"
        (save)="saveClient($event)"
        (delete)="toggleClientStatus($event)"
        (bulkDelete)="deactivateClients($event)"
        (view)="viewClient($event)"
        (lazyLoad)="onLazyLoad($event)"
    />
}
